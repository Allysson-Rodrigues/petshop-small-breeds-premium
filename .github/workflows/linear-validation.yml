name: Linear validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

jobs:
  require-linear-id:
    runs-on: ubuntu-latest
    steps:
      - name: Check Linear issue ID in branch or PR title
        run: |
          node -e "
          const regex = /([A-Z][A-Z0-9]+-[0-9]+)/;
          const candidates = [
            process.env.GITHUB_HEAD_REF,
            process.env.GITHUB_REF_NAME,
            process.env.PR_TITLE,
          ].filter(Boolean);
          if (candidates.some(v => regex.test(v))) {
            console.log('OK: Linear issue id found in: ' + candidates.join(' | '));
            process.exit(0);
          }
          console.error('ERROR: Missing Linear issue id (e.g. ALL-123) in branch name or PR title.');
          console.error('Checked: ' + (candidates.join(' | ') || 'none'));
          process.exit(1);
          "
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
